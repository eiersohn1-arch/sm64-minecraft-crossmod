name: Native Minecraft fusion

on:
  push:
    branches: [native-minecraft-fusion]
  pull_request:

jobs:
  native-architecture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Python generators
        run: python -m py_compile tools/bootstrap_um.py tools/generate_native_minecraft.py tools/build_sm64.py tools/patch_sm64_toolchain.py
      - name: Reject passthrough runtime files
        shell: bash
        run: |
          test ! -e tools/generate_sm64_host.py
          test ! -e tools/sync_um_reference.py
          test ! -e tools/patch_guest_for_sm64.py
          test ! -e start-guest.bat
          test ! -e start-fake-host.bat
      - name: Bootstrap Pattern 4 source of truth
        run: python tools/bootstrap_um.py
      - name: Generate native runtime
        run: python tools/generate_native_minecraft.py
      - name: Verify generated native files
        shell: bash
        run: |
          test -f vendor/sm64-port/src/pc/native_minecraft/native_minecraft.cpp
          grep -q "simulate_movement" vendor/sm64-port/src/pc/native_minecraft/native_minecraft.cpp
          grep -q "native_minecraft_tick" vendor/sm64-port/src/game/mario.c
          grep -q "native_minecraft_override_camera" vendor/sm64-port/src/game/camera.c

  windows-native-syntax:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse Windows runner
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path "windows-crossmod.ps1"),
            [ref]$null,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
      - name: Set up MSYS2 MinGW64
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git
            python
            mingw-w64-x86_64-gcc
      - name: Generate native fusion
        shell: msys2 {0}
        run: |
          python tools/bootstrap_um.py
          python tools/generate_native_minecraft.py
          python tools/patch_sm64_toolchain.py
      - name: Syntax-check native runtime and hooks
        shell: msys2 {0}
        run: |
          cd vendor/sm64-port
          g++ -std=gnu++17 -fsyntax-only \
            -DTARGET_PC=1 -DTARGET_WINDOWS=1 -DVERSION_US=1 \
            -DAVOID_UB=1 -DNON_MATCHING=1 -DNO_SEGMENTED_MEMORY=1 \
            -DUSE_SYSTEM_MALLOC=1 -D_LANGUAGE_C=1 \
            -I. -Iinclude -Isrc -Isrc/pc \
            src/pc/native_minecraft/native_minecraft.cpp
          gcc -std=gnu11 -fsyntax-only \
            -DTARGET_PC=1 -DTARGET_WINDOWS=1 -DVERSION_US=1 \
            -DAVOID_UB=1 -DNON_MATCHING=1 \
            -I. -Iinclude -Isrc -Isrc/pc \
            src/game/mario.c src/game/camera.c src/game/hud.c
