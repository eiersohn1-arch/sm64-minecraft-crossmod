name: build

on:
  push:
    branches: [ "main" ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Validate passthrough Python tooling
        run: python -m py_compile tools/prepare_passthrough.py

      - name: Validate passthrough bridge sources
        run: |
          test -f sm64-host/crossmod_bridge.c
          test -f sm64-host/crossmod_bridge.h
          grep -q "GRAPH_RENDER_INVISIBLE" sm64-host/crossmod_bridge.c
          grep -q "CROSSMOD_PORT 6464" sm64-host/crossmod_bridge.c
          grep -q "crossmod_process_combat" sm64-host/crossmod_bridge.c
          grep -q "gLakituState.curPos" sm64-host/crossmod_bridge.c
          grep -q "attackSerial" src/client/java/dev/eiersohn/sm64cross/client/bridge/PassthroughBridgeClient.java
          grep -q "sm64-port/sm64-port.git" tools/prepare_passthrough.py

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Build Fabric bridge
        run: ./gradlew build
