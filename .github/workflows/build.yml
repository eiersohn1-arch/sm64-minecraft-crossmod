name: build

on:
  push:
    branches: [ "main" ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Validate passthrough Python tooling
        run: python -m py_compile tools/prepare_passthrough.py tools/verify_whole_game.py

      - name: Validate passthrough bridge sources
        run: |
          test -f sm64-host/crossmod_bridge.c
          test -f sm64-host/crossmod_bridge.h
          grep -q "crossmod_bridge_apply_controller" sm64-host/crossmod_bridge.c
          grep -q "crossmod_ws_start" sm64-host/crossmod_ws_api.cpp
          grep -q "MCPassthroughFrame" src/client/java/dev/eiersohn/sm64cross/client/render/Sm64FrameExporter.java
          grep -q "WebSocketServer" src/client/java/dev/eiersohn/sm64cross/client/bridge/HostLink.java
          grep -q "crossmod_bridge_after_mario_update" sm64-host/crossmod_bridge.c
          grep -q "GRAPH_RENDER_INVISIBLE" sm64-host/crossmod_bridge.c
          grep -q "crossmod_process_combat" sm64-host/crossmod_bridge.c
          grep -q "gLakituState.curPos" sm64-host/crossmod_bridge.c
          grep -q "guest" src/client/java/dev/eiersohn/sm64cross/client/bridge/InputPublisher.java
          grep -q "BackgroundGuestWindow" src/client/java/dev/eiersohn/sm64cross/client/Sm64CrossClient.java
          grep -q "Sm64PerspectiveSync" src/client/java/dev/eiersohn/sm64cross/client/Sm64CrossClient.java
          grep -q "THIRD_PERSON_FRONT" src/client/java/dev/eiersohn/sm64cross/client/render/Sm64PerspectiveSync.java
          grep -q "captureThirdPersonWorld" src/client/java/dev/eiersohn/sm64cross/client/mixin/Sm64GameRendererMixin.java
          grep -q "hostWidth" src/client/java/dev/eiersohn/sm64cross/client/bridge/HostState.java
          grep -q "GetAsyncKeyState" sm64-host/crossmod_bridge.c
          grep -q "crossmod_send_slot" sm64-host/crossmod_bridge.c
          grep -q "crossmod_send_pointer" sm64-host/crossmod_bridge.c
          grep -q "crossmod_send_movement_input" sm64-host/crossmod_bridge.c
          grep -q "crossmod_bridge_sync_minecraft_proxy" sm64-host/crossmod_bridge.c
          grep -q "keySprint.setDown" src/client/java/dev/eiersohn/sm64cross/client/bridge/GuestCommandHandler.java
          grep -q 'case "look"' src/client/java/dev/eiersohn/sm64cross/client/bridge/GuestCommandHandler.java
          grep -q "sensitivity().get()" src/client/java/dev/eiersohn/sm64cross/client/bridge/GuestCommandHandler.java
          grep -q "look.*dx.*dy" sm64-host/crossmod_bridge.c

      - name: Patch a fresh upstream SM64 checkout
        run: |
          mkdir -p vendor
          git clone --depth 1 https://github.com/sm64-port/sm64-port.git vendor/sm64-port
          git clone --depth 1 https://github.com/rehan-remade/universal-modder vendor/universal-modder
          python - <<'PY'
          from pathlib import Path
          import tools.prepare_passthrough as p

          # Simulate a user's already-patched vendor checkout from the old
          # position-authority bridge, then ensure the current setup migrates
          # it automatically.
          mario = Path("vendor/sm64-port/src/game/mario.c")
          text = mario.read_text(encoding="utf-8")
          vanilla = (
              "    if (gMarioState->action) {\n"
              "        gMarioState->marioObj->header.gfx.node.flags &= ~GRAPH_RENDER_INVISIBLE;\n"
              "        mario_reset_bodystate(gMarioState);"
          )
          legacy = (
              "    if (gMarioState->action) {\n"
              "        if (crossmod_bridge_apply_mario(gMarioState)) {\n"
              "            gMarioState->marioObj->header.gfx.node.flags |= GRAPH_RENDER_INVISIBLE;\n"
              "            mario_reset_bodystate(gMarioState);\n"
              "            mario_handle_special_floors(gMarioState);\n"
              "            mario_process_interactions(gMarioState);\n"
              "            gMarioState->marioObj->oInteractStatus = 0;\n"
              "            return 0;\n"
              "        }\n"
              "        gMarioState->marioObj->header.gfx.node.flags &= ~GRAPH_RENDER_INVISIBLE;\n"
              "        mario_reset_bodystate(gMarioState);"
          )
          if vanilla not in text:
              raise SystemExit("vanilla Mario migration marker missing")
          mario.write_text(text.replace(vanilla, legacy, 1), encoding="utf-8")

          p.patch_sm64_port_toolchain()
          p.install_bridge()

          migrated = mario.read_text(encoding="utf-8")
          if "crossmod_bridge_apply_mario" in migrated:
              raise SystemExit("legacy apply_mario patch survived migration")

          print("fresh/legacy checkout migration patch OK")
          PY
          grep -q "crossmod_bridge_apply_controller(gPlayer1Controller)" vendor/sm64-port/src/game/game_init.c
          grep -q "crossmod_bridge_after_mario_update(gMarioState)" vendor/sm64-port/src/game/mario.c
          grep -q "crossmod_bridge_sync_minecraft_proxy(gMarioState)" vendor/sm64-port/src/game/mario.c
          grep -q "Minecraft-authoritative proxy sync" vendor/sm64-port/src/game/mario.c
          if grep -q "Crossmod locomotion mode" vendor/sm64-port/src/game/mario.c; then
            echo "old full locomotion bypass survived"
            exit 1
          fi
          grep -q "crossmod_bridge_override_camera(c)" vendor/sm64-port/src/game/camera.c
          grep -q "crossmod_bridge_mouse_wheel(wheel_y)" vendor/sm64-port/src/pc/gfx/gfx_sdl2.c
          grep -q "crossmod_bridge_load_block_surfaces" vendor/sm64-port/src/game/object_list_processor.c
          grep -q "crossmod_add_dynamic_box" vendor/sm64-port/src/engine/surface_load.c
          grep -q "crossmod_bridge_poll" vendor/sm64-port/src/pc/pc_main.c
          test -f vendor/sm64-port/src/pc/ws.cpp
          test -f vendor/sm64-port/src/pc/ws.h
          test -f vendor/sm64-port/src/pc/crossmod_ws_api.cpp
          test -f vendor/sm64-port/src/pc/gfx/mc_overlay_dx11.inc
          grep -q "mc_overlay_render" vendor/sm64-port/src/pc/gfx/gfx_direct3d11.cpp
          grep -q "depth_shader_resource_view" vendor/sm64-port/src/pc/gfx/gfx_direct3d11.cpp

      - name: Whole-game integrity
        run: |
          python tools/verify_whole_game.py --sm64-port vendor/sm64-port

      - name: Syntax-check SM64 bridge against upstream headers
        run: |
          gcc -std=gnu11 -fsyntax-only             -DTARGET_PC=1 -DVERSION_US=1 -DAVOID_UB=1 -DNON_MATCHING=1             -Ivendor/sm64-port             -Ivendor/sm64-port/include             -Ivendor/sm64-port/src             vendor/sm64-port/src/pc/crossmod_bridge.c

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Build Fabric bridge
        run: ./gradlew build


  windows-sm64-renderer-check:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up MSYS2 MinGW64
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git
            python
            mingw-w64-x86_64-gcc

      - name: Patch fresh SM64 D3D11 renderer
        shell: msys2 {0}
        run: |
          mkdir -p vendor
          git clone --depth 1 https://github.com/sm64-port/sm64-port.git vendor/sm64-port
          git clone --depth 1 https://github.com/rehan-remade/universal-modder vendor/universal-modder
          python - <<'PY'
          import tools.prepare_passthrough as p
          p.install_bridge()
          print("D3D11 compositor patch OK")
          PY

      - name: Syntax-check patched D3D11 compositor
        shell: msys2 {0}
        run: |
          cd vendor/sm64-port
          g++ -std=gnu++17 -fsyntax-only             -DENABLE_DX11=1 -DTARGET_WINDOWS=1             -DNO_SEGMENTED_MEMORY=1 -DUSE_SYSTEM_MALLOC=1             -DWIDESCREEN=1 -D_LANGUAGE_C=1 -DVERSION_US=1             -I. -Iinclude -Isrc -Isrc/pc -Isrc/pc/gfx             src/pc/gfx/gfx_direct3d11.cpp
          g++ -std=gnu++17 -fsyntax-only -Isrc/pc src/pc/ws.cpp src/pc/crossmod_ws_api.cpp
          gcc -std=gnu11 -fsyntax-only \
            -DTARGET_PC=1 -DVERSION_US=1 -DAVOID_UB=1 -DNON_MATCHING=1 \
            -I. -Iinclude -Isrc -Isrc/pc \
            src/pc/crossmod_bridge.c

      - name: Compile-check embedded passthrough shader
        shell: msys2 {0}
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path("vendor/sm64-port/src/pc/gfx/mc_overlay_dx11.inc").read_text(encoding="utf-8")
          try:
              shader = source.split('R"HLSL(', 1)[1].split(')HLSL"', 1)[0]
          except IndexError as exc:
              raise SystemExit("embedded HLSL block not found") from exc

          Path("vendor/sm64-port/build-sm64cross-compositor.hlsl").write_text(shader, encoding="utf-8")
          PY
          g++ -std=gnu++17 tools/compositor_shader_check.cpp -ld3dcompiler -o shader-check.exe
          ./shader-check.exe vendor/sm64-port/build-sm64cross-compositor.hlsl
