name: Universal Modder clean rebuild

on:
  push:
    branches: [universal-modder-clean-rebuild]
  pull_request:

jobs:
  architecture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Validate clean bootstrap tooling
        run: python -m py_compile tools/bootstrap_um.py tools/sync_um_reference.py tools/patch_guest_for_sm64.py tools/generate_sm64_host.py tools/build_sm64.py

      - name: Reject legacy crossmod implementation
        shell: bash
        run: |
          test ! -e sm64-host/crossmod_bridge.c
          test ! -e src/client/java/dev/eiersohn/sm64cross/client/render/SmoothSurvivalHud.java
          test ! -e src/client/java/dev/eiersohn/sm64cross/client/bridge/Sm64TerrainProxy.java

      - name: Bootstrap Universal Modder source of truth
        run: python tools/bootstrap_um.py

      - name: Sync Minecraft guest from Universal Modder
        run: python tools/sync_um_reference.py

      - name: Verify guest is the Universal Modder reference
        shell: bash
        run: diff -qr vendor/universal-modder/examples/minecraft-gta5-passthrough/mc generated/minecraft-guest

      - name: Apply SM64 guest authority delta
        run: python tools/patch_guest_for_sm64.py

      - name: Build Universal Modder Minecraft guest with SM64 delta
        working-directory: generated/minecraft-guest
        run: ./gradlew build --no-daemon

      - name: Generate clean SM64 host adapter
        run: python tools/generate_sm64_host.py

      - name: Verify SM64 host wiring
        shell: bash
        run: |
          grep -q 'um_passthrough_start' vendor/sm64-port/src/pc/pc_main.c
          grep -q 'um_passthrough_frame' vendor/sm64-port/src/pc/pc_main.c
          grep -q 'um_passthrough_stop' vendor/sm64-port/src/pc/pc_main.c
          grep -q '127.0.0.1' vendor/sm64-port/src/pc/sm64_passthrough.cpp
          grep -Fq '\"t\":\"ground\"' vendor/sm64-port/src/pc/sm64_passthrough.cpp
          grep -q 'find_floor' vendor/sm64-port/src/pc/sm64_passthrough.cpp
          grep -q 'mcpt_sm64_overlay.inc' vendor/sm64-port/src/pc/gfx/gfx_direct3d11.cpp
          grep -q 'um_mcpt_draw' vendor/sm64-port/src/pc/gfx/gfx_direct3d11.cpp
          grep -q 'depth_stencil_srv' vendor/sm64-port/src/pc/gfx/gfx_direct3d11.cpp
          grep -q 'D3D11_BIND_SHADER_RESOURCE' vendor/sm64-port/src/pc/gfx/gfx_direct3d11.cpp
          grep -Fq 'Local\\MCPassthroughFrame' vendor/sm64-port/src/pc/gfx/mcpt_sm64_overlay.inc
          grep -q 'Texture2D<float> McDepth' vendor/sm64-port/src/pc/gfx/mcpt_sm64_overlay.inc
          grep -q 'Texture2D<float> HostDepth' vendor/sm64-port/src/pc/gfx/mcpt_sm64_overlay.inc
          grep -q 'sFOVState.fov + sFOVState.fovOffset' vendor/sm64-port/src/pc/sm64_passthrough.cpp
          grep -q 'lws2_32' vendor/sm64-port/Makefile
          cmp vendor/universal-modder/examples/minecraft-gta5-passthrough/gta/src/ws.cpp vendor/sm64-port/src/pc/ws.cpp
          cmp vendor/universal-modder/examples/minecraft-gta5-passthrough/gta/src/ws.h vendor/sm64-port/src/pc/ws.h
