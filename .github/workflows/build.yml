name: Universal Modder clean rebuild

on:
  push:
    branches: [universal-modder-clean-rebuild]
  pull_request:

jobs:
  architecture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Validate clean bootstrap tooling
        run: python -m py_compile tools/bootstrap_um.py tools/sync_um_reference.py tools/patch_guest_for_sm64.py tools/generate_sm64_host.py tools/build_sm64.py tools/patch_sm64_toolchain.py tools/verify_clean_rebuild.py

      - name: Reject legacy crossmod implementation
        shell: bash
        run: |
          test ! -e sm64-host/crossmod_bridge.c
          test ! -e src/client/java/dev/eiersohn/sm64cross/client/render/SmoothSurvivalHud.java
          test ! -e src/client/java/dev/eiersohn/sm64cross/client/bridge/Sm64TerrainProxy.java

      - name: Bootstrap Universal Modder source of truth
        run: python tools/bootstrap_um.py

      - name: Sync Minecraft guest from Universal Modder
        run: python tools/sync_um_reference.py

      - name: Verify guest starts from the Universal Modder reference
        shell: bash
        run: diff -qr vendor/universal-modder/examples/minecraft-gta5-passthrough/mc generated/minecraft-guest

      - name: Apply tiny SM64 guest visibility delta
        run: python tools/patch_guest_for_sm64.py

      - name: Build Universal Modder Minecraft guest with SM64 delta
        working-directory: generated/minecraft-guest
        run: ./gradlew build --no-daemon

      - name: Generate clean SM64 host adapter
        run: python tools/generate_sm64_host.py

      - name: Verify clean Universal Modder architecture
        run: python tools/verify_clean_rebuild.py


  windows-sm64-syntax:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Parse unified Windows runner
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path "windows-crossmod.ps1"),
            [ref]$null,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }

      - name: Set up MSYS2 MinGW64
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git
            python
            mingw-w64-x86_64-gcc

      - name: Generate clean Universal Modder SM64 host
        shell: msys2 {0}
        run: |
          python tools/bootstrap_um.py
          python tools/generate_sm64_host.py
          python tools/patch_sm64_toolchain.py

      - name: Build patched bundled armips
        shell: msys2 {0}
        run: |
          make -C vendor/sm64-port/tools armips

      - name: Syntax-check clean host and D3D11 compositor
        shell: msys2 {0}
        run: |
          cd vendor/sm64-port
          g++ -std=gnu++17 -fsyntax-only             -DTARGET_PC=1 -DTARGET_WINDOWS=1 -DVERSION_US=1             -DAVOID_UB=1 -DNON_MATCHING=1 -DNO_SEGMENTED_MEMORY=1             -DUSE_SYSTEM_MALLOC=1 -D_LANGUAGE_C=1             -I. -Iinclude -Isrc -Isrc/pc -Isrc/pc/gfx             src/pc/sm64_passthrough.cpp src/pc/ws.cpp
          g++ -std=gnu++17 -fsyntax-only             -DENABLE_DX11=1 -DTARGET_WINDOWS=1 -DNO_SEGMENTED_MEMORY=1             -DUSE_SYSTEM_MALLOC=1 -DWIDESCREEN=1 -D_LANGUAGE_C=1             -DVERSION_US=1 -I. -Iinclude -Isrc -Isrc/pc -Isrc/pc/gfx             src/pc/gfx/gfx_direct3d11.cpp
          gcc -std=gnu11 -fsyntax-only             -DTARGET_PC=1 -DTARGET_WINDOWS=1 -DVERSION_US=1             -DAVOID_UB=1 -DNON_MATCHING=1             -I. -Iinclude -Isrc -Isrc/pc             src/game/mario.c src/game/camera.c src/game/hud.c
