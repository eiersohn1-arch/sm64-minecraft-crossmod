name: Universal Modder real Minecraft passthrough

on:
  push:
    branches: [universal-modder-real-minecraft]
  pull_request:

jobs:
  architecture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Validate integration tooling
        run: |
          python -m py_compile             tools/bootstrap_um.py             tools/sync_um_reference.py             tools/patch_guest_for_sm64.py             tools/generate_sm64_host.py             tools/build_sm64.py tools/verify_clean_rebuild.py

      - name: Reject old native-reimplementation path
        shell: bash
        run: |
          test ! -e native_runtime
          test ! -e sm64-host/crossmod_bridge.c
          test ! -e src/client/java/dev/eiersohn/sm64cross/client/render/SmoothSurvivalHud.java

      - name: Bootstrap Universal Modder source of truth
        run: python tools/bootstrap_um.py

      - name: Sync real Minecraft guest verbatim
        run: python tools/sync_um_reference.py

      - name: Verify guest starts exactly from Universal Modder
        shell: bash
        run: diff -qr vendor/universal-modder/examples/minecraft-gta5-passthrough/mc generated/minecraft-guest

      - name: Apply SM64 survival-control delta
        run: python tools/patch_guest_for_sm64.py

      - name: Build real Universal Modder Minecraft guest
        working-directory: generated/minecraft-guest
        run: ./gradlew build --no-daemon

      - name: Generate SM64 host adapter
        run: python tools/generate_sm64_host.py

      - name: Verify real Universal Modder architecture
        run: python tools/verify_clean_rebuild.py

  windows-host-syntax:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Parse one-click Windows runner
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path "windows-crossmod.ps1"),
            [ref]$null,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }

      - name: Set up MSYS2 MinGW64
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git
            python
            make
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-SDL2
            mingw-w64-x86_64-glew

      - name: Generate real Universal Modder guest and SM64 host
        shell: msys2 {0}
        run: |
          python tools/bootstrap_um.py
          python tools/sync_um_reference.py
          python tools/patch_guest_for_sm64.py
          python tools/generate_sm64_host.py
          python tools/patch_sm64_toolchain.py

      - name: Syntax-check host, raw input and D3D11 compositor
        shell: msys2 {0}
        run: |
          cd vendor/sm64coopdx
          COMMON="-DTARGET_PC=1 -DVERSION_US=1 -DAVOID_UB=1 -DNON_MATCHING=1 -D_LANGUAGE_C=1 -DWINSOCK -I. -Iinclude -Isrc -Isrc/pc -Isrc/pc/gfx -Isound -Ilib/lua/include -Ilib/coopnet/include $(sdl2-config --cflags)"

          g++ -std=gnu++17 -fsyntax-only $COMMON             src/pc/sm64_passthrough.cpp             src/pc/ws.cpp

          g++ -std=gnu++17 -fsyntax-only $COMMON -DENABLE_DX11=1             src/pc/gfx/gfx_dxgi.cpp             src/pc/gfx/gfx_direct3d11.cpp

          gcc -std=gnu11 -fsyntax-only $COMMON             src/game/mario.c             src/game/camera.c             src/game/hud.c             src/pc/pc_main.c

      - name: Compile host adapter objects without retail ROM
        shell: msys2 {0}
        run: |
          cd vendor/sm64-port
          mkdir -p build/passthrough-ci
          COMMON="-DTARGET_PC=1 -DTARGET_WINDOWS=1 -DVERSION_US=1 -DAVOID_UB=1 -DNON_MATCHING=1 -DNO_SEGMENTED_MEMORY=1 -DUSE_SYSTEM_MALLOC=1 -D_LANGUAGE_C=1 -I. -Iinclude -Isrc -Isrc/pc -Isrc/pc/gfx"

          g++ -std=gnu++17 -c $COMMON src/pc/sm64_passthrough.cpp -o build/passthrough-ci/sm64_passthrough.o
          g++ -std=gnu++17 -c $COMMON src/pc/ws.cpp -o build/passthrough-ci/ws.o

          test -s build/passthrough-ci/sm64_passthrough.o
          test -s build/passthrough-ci/ws.o

      - name: Verify generated Universal Modder host contract
        shell: msys2 {0}
        run: python tools/verify_clean_rebuild.py
