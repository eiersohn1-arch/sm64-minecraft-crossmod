plugins {
    id 'fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
}

loom {
    splitEnvironmentSourceSets()
    mods {
        "sm64cross" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    // Same localhost WebSocket topology as universal-modder's
    // minecraft-gta5-passthrough example.
    implementation "org.java-websocket:Java-WebSocket:1.6.0"
    include "org.java-websocket:Java-WebSocket:1.6.0"

    // Java 21 bridge to Win32 named shared memory. This gives us the same
    // Local\\MCPassthroughFrame transport without requiring JNI.
    implementation "net.java.dev.jna:jna:5.17.0"
    include "net.java.dev.jna:jna:5.17.0"
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}
